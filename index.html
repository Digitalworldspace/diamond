<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Diamond Portal — Sign In</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <svg class="diamond-mark" viewBox="0 0 24 24"><path d="M4 9 L12 3 L20 9 L12 21 Z M4 9 L20 9 M9 9 L12 3 L15 9 M9 9 L12 21 M15 9 L12 21"/></svg>
      <h1>Diamond Portal</h1>
      <p>Sign in to continue</p>
    </div>

    <div class="login-error" id="loginError"></div>

    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" required autocomplete="username" placeholder="e.g. admin" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; padding:11px;" id="loginBtn">Sign in</button>
    </form>

    <p class="login-hint">Access is provided by your company administrator. Contact them if you don't have a login.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script>
  // If already signed in, jump straight to the right panel.
  (function () {
    const user = getSession();
    if (user) window.location.href = user.role === "admin" ? "admin.html" : "customer.html";
  })();

  const form = document.getElementById("loginForm");
  const errorBox = document.getElementById("loginError");
  const btn = document.getElementById("loginBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("show");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in…';

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    const { data, error } = await sb
      .from("users")
      .select("*")
      .eq("username", username)
      .eq("password", password)
      .maybeSingle();

    btn.disabled = false;
    btn.textContent = "Sign in";

    if (error) {
      errorBox.textContent = "Something went wrong: " + error.message;
      errorBox.classList.add("show");
      return;
    }
    if (!data) {
      errorBox.textContent = "Incorrect username or password.";
      errorBox.classList.add("show");
      return;
    }

    setSession(data);
    window.location.href = data.role === "admin" ? "admin.html" : "customer.html";
  });
</script>
</body>
</html>
