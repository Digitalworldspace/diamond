<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diamond Portal - Login</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-gem" style="font-size: 3rem; color: #0f172a;"></i>
                <h1>Diamond Portal</h1>
                <p>Select your role to continue</p>
            </div>
            
            <div class="role-selection">
                <a href="admin.html" class="role-card admin-role">
                    <i class="fas fa-user-cog" style="font-size: 2.5rem;"></i>
                    <h2>Admin Panel</h2>
                    <p>Manage company settings</p>
                </a>
                
                <a href="customer.html" class="role-card customer-role">
                    <i class="fas fa-user" style="font-size: 2.5rem;"></i>
                    <h2>Customer Panel</h2>
                    <p>View and manage diamonds</p>
                </a>
            </div>
            
            <div class="login-footer">
                <small>Simple &amp; Sober Design</small>
            </div>
        </div>
    </div>
</body>
</html>
