<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Diamond Portal — Stones</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-brand" id="sidebarBrand">
      <svg class="diamond-mark" viewBox="0 0 24 24"><path d="M4 9 L12 3 L20 9 L12 21 Z M4 9 L20 9 M9 9 L12 3 L15 9 M9 9 L12 21 M15 9 L12 21"/></svg>
      <div><span>Diamond Portal</span><small id="companyNameTag">Stones</small></div>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-link active" data-view="stones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9 L12 3 L20 9 L12 21 Z"/></svg>
        Stones
      </a>
      <a class="nav-link" data-view="myrequests">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4h16v14l-4 3v-3H4z"/></svg>
        My requests
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user"><strong id="custName">—</strong><span id="custEmail"></span></div>
      <button class="btn btn-ghost btn-sm" style="width:100%" onclick="logout()">Sign out</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="menu-toggle" aria-label="Toggle menu">☰</button>
        <div>
          <h1 id="pageTitle">Stones</h1>
          <p id="pageSubtitle">Browse available stones. Select any to send a request.</p>
        </div>
      </div>
    </div>

    <div class="content">

      <!-- STONES LIST -->
      <section class="view active" id="view-stones">
        <div class="panel">
          <div class="panel-header">
            <div class="toolbar">
              <div class="search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
                <input type="text" id="stoneSearch" placeholder="Search stone ID, shape…" />
              </div>
              <select class="select-filter" id="stoneStatusFilter">
                <option value="">All statuses</option>
                <option value="available">Available</option>
                <option value="hold">Hold</option>
                <option value="confirmed">Confirmed</option>
                <option value="sold">Sold</option>
              </select>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style="width:34px;"><input type="checkbox" class="chk" id="selectAllChk" /></th>
                  <th>Stone</th><th>Shape</th><th>Cts</th><th>Colour</th><th>Clarity</th><th>Price</th><th>Status</th><th>Quick action</th>
                </tr>
              </thead>
              <tbody id="stonesTbody"><tr><td colspan="9" class="loading-row">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- MY REQUESTS -->
      <section class="view" id="view-myrequests">
        <div class="panel">
          <div class="panel-header"><h2>My requests</h2></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Stone</th><th>Action requested</th><th>Note</th><th>Status</th><th>Date</th></tr></thead>
              <tbody id="myRequestsTbody"><tr><td colspan="5" class="loading-row">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
      </section>

    </div>
  </div>
</div>

<!-- Bulk action bar -->
<div class="bulk-bar" id="bulkBar">
  <div class="count"><span id="bulkCount">0</span> stone(s) selected</div>
  <div class="bulk-actions">
    <button class="btn" onclick="openBulkModal('hold')">Hold</button>
    <button class="btn btn-gold" onclick="openBulkModal('confirm')">Confirm</button>
    <button class="btn" onclick="openBulkModal('request_video')">Request video</button>
    <button class="btn" onclick="openBulkModal('request_memo')">Request memo</button>
    <button class="btn" onclick="openBulkModal('request_certificate')">Request certificate</button>
  </div>
  <button class="clear-link" onclick="clearSelection()">Clear selection</button>
</div>

<!-- Bulk / single action confirmation modal -->
<div class="modal-overlay" id="actionModalOverlay">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h2 id="actionModalTitle">Send request</h2>
      <button class="modal-close" onclick="closeActionModal()">✕</button>
    </div>
    <div class="modal-body">
      <p class="text-muted" id="actionModalDesc" style="margin-bottom:16px;"></p>
      <div class="field">
        <label>Note to admin <span class="hint">(optional)</span></label>
        <textarea id="actionNote" placeholder="Add any details, e.g. quantity needed, delivery timing…"></textarea>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" onclick="closeActionModal()">Cancel</button>
        <button type="button" class="btn btn-primary" id="actionSubmitBtn" onclick="submitAction()">Send request</button>
      </div>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox-overlay" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt="Stone image" />
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/customer.js"></script>
</body>
</html>
