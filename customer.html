<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Panel - Diamond Portal</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app customer-app">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <i class="fas fa-gem" style="font-size: 1.5rem; color: #0f172a;"></i>
                <h1>Customer Panel</h1>
                <span class="badge">Diamond Inventory</span>
            </div>
            <div class="header-right">
                <a href="index.html" class="btn btn-outline btn-sm">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
                <a href="admin.html" class="btn btn-sm">
                    <i class="fas fa-user-cog"></i> Admin View
                </a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="card">
            <div class="list-toolbar">
                <div>
                    <span style="font-weight: 500; font-size:1rem;">
                        <i class="fas fa-gem" style="margin-right:0.4rem;"></i> Diamond Inventory
                    </span>
                    <span class="badge" style="margin-left:0.8rem;" id="selectedCounter">0 selected</span>
                </div>
                <div class="bulk-actions">
                    <button class="btn btn-sm" id="selectAllBtn">
                        <i class="far fa-square"></i> All
                    </button>
                    <button class="btn btn-sm" id="deselectAllBtn">
                        <i class="far fa-square"></i> None
                    </button>
                    <button class="btn btn-sm btn-primary" id="bulkConfirmBtn">
                        <i class="fas fa-check-circle"></i> Confirm
                    </button>
                    <button class="btn btn-sm" id="bulkHoldBtn">
                        <i class="fas fa-pause-circle"></i> Hold
                    </button>
                    <button class="btn btn-sm" id="bulkReleaseBtn">
                        <i class="fas fa-undo-alt"></i> Release
                    </button>
                </div>
            </div>

            <!-- Diamond Grid -->
            <div class="diamond-grid" id="diamondGrid">
                <!-- Cards injected by JS -->
            </div>
            
            <div style="margin-top:1.2rem; font-size:0.85rem; color: #475569;">
                <i class="fas fa-arrow-pointer"></i> Select stones, then use bulk actions.
            </div>
        </div>
    </div>

    <script src="js/supabase-config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/customer.js"></script>
</body>
</html>
